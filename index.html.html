<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Цифровой мультикуб</title><style>
:root{--g:#173f35;--line:#d9ddd5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 58%,#fff,#eef2eb);color:#18372f;font:15px Arial,sans-serif;min-height:100vh}button,input,textarea{font:inherit}.bar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:bold;letter-spacing:.15em}.brand i{display:inline-grid;place-items:center;width:38px;height:38px;background:var(--g);color:#fff;border-radius:10px;font:22px Georgia;margin-right:10px}.edit{border:1px solid var(--line);background:#f8faf7;color:var(--g);border-radius:10px;padding:10px 14px;font-weight:bold}.intro{text-align:center;margin:28px 16px 0}.intro h1{font:42px Georgia;margin:8px}.intro p{color:#718078}.stage{height:440px;display:flex;align-items:center;justify-content:center;perspective:1300px;overflow:hidden}.scene{width:700px;height:430px;display:grid;place-items:center;touch-action:none}.cube{width:200px;height:200px;position:relative;transform-style:preserve-3d;transition:transform .65s}.face,.panel,.lid,.base{position:absolute;inset:0;transform-style:preserve-3d}.face{border:3px solid #0e3028;background:linear-gradient(145deg,#2b6452,#173f35)}.front{transform:translateZ(100px)}.back{transform:rotateY(180deg) translateZ(100px)}.right{transform:rotateY(90deg) translateZ(100px)}.left{transform:rotateY(-90deg) translateZ(100px)}.top{transform:rotateX(90deg) translateZ(100px);display:grid;place-items:center;color:#fff;font-weight:bold;letter-spacing:.16em}.bottom{transform:rotateX(-90deg) translateZ(100px)}.open .solid{opacity:0;pointer-events:none}.solid{transition:.25s}.base{background:#19463a;border:4px solid #10342b}.panel{border:4px solid #10342b;background:#1e5042;padding:9px;transition:transform .9s;cursor:pointer}.p0{transform:rotateX(-90deg);transform-origin:bottom}.p1{transform:rotateY(90deg);transform-origin:left}.p2{transform:rotateX(90deg);transform-origin:top}.p3{transform:rotateY(-90deg);transform-origin:right}.open .p0{transform:translateY(-200px)}.open .p1{transform:translateX(200px)}.open .p2{transform:translateY(200px)}.open .p3{transform:translateX(-200px)}.lid{background:var(--g);border:5px solid #10342b;transform:translateZ(196px);transition:transform .9s;opacity:0}.open .lid{opacity:1;transform:translateZ(196px) rotateX(115deg)}.cube:not(.open)>.base,.cube:not(.open)>.panel{opacity:0}.card{height:100%;padding:15px;border-radius:7px;background:#f6eddc;display:flex;flex-direction:column;justify-content:center;transition:transform .65s}.card img{width:100%;height:90px;object-fit:cover;border-radius:6px}.card small{opacity:.55;font-size:9px;letter-spacing:.12em}.card b{font:17px Georgia;margin-top:8px}.controls{display:flex;justify-content:center;gap:10px;margin-top:-12px}.controls button{height:48px;border-radius:13px;padding:0 20px;border:1px solid var(--line);background:#fff}.controls .main{background:var(--g);color:#fff;border:0;font-weight:bold;min-width:210px}.overlay{position:fixed;inset:0;background:#edf1eb;z-index:10;overflow:auto;padding:24px;display:none}.overlay.show{display:block}.editor{max-width:1050px;margin:auto}.head{background:#fff;border:1px solid var(--line);padding:25px;border-radius:20px;position:relative}.head h2{font:32px Georgia;margin:5px}.close{position:absolute;right:18px;top:18px;border:0;background:#edf1eb;border-radius:50%;width:38px;height:38px;font-size:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.item{background:#fff;border:1px solid var(--line);padding:15px;border-radius:16px}.upload{height:130px;background:#f3eddf;border:1px dashed #93a29a;border-radius:10px;display:grid;place-items:center;overflow:hidden;cursor:pointer;margin:10px 0}.upload input{display:none}.upload img{width:100%;height:100%;object-fit:cover}.item>label:not(.upload){display:block;font-size:11px;font-weight:bold;color:#65736c;margin-top:8px}.item input,.item textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:4px}.item textarea{height:75px}.save{display:block;margin:20px auto;background:var(--g);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-weight:bold}.modal{position:fixed;inset:0;background:#102d27bb;z-index:9;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modal article{width:min(600px,95vw);min-height:390px;background:#f6eddc;border-radius:25px;padding:45px;text-align:center;position:relative}.modal img{max-width:100%;max-height:230px;border-radius:10px}.modal h2{font:32px Georgia}.modal p{font-size:18px;line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.stage{transform:scale(.78);margin:-25px -100px;width:calc(100% + 200px)}.intro h1{font-size:34px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.brand{font-size:12px}}
</style></head><body><header class="bar"><div class="brand"><i>М</i>МУЛЬТИКУБ</div><button class="edit" onclick="editor(true)">✎ Редактировать</button></header><section class="intro"><small>ИНТЕРАКТИВНЫЙ ИНСТРУМЕНТ</small><h1>Цифровой мультикуб</h1><p>Откройте куб, поворачивайте его и выбирайте задания.</p></section><section class="stage"><div class="scene" id="scene"><div class="cube" id="cube"><div class="solid"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face bottom"></div><div class="face top">МУЛЬТИКУБ</div></div><div class="base"></div><div class="lid"></div><div id="panels"></div></div></div></section><div class="controls"><button onclick="rotate(-90)">↶ Повернуть</button><button class="main" id="openBtn" onclick="toggle()">Открыть мультикуб</button><button onclick="rotate(90)">Повернуть ↷</button></div><div class="overlay" id="editor"><div class="editor"><div class="head"><button class="close" onclick="editor(false)">×</button><small>НАСТРОЙКА ЗАНЯТИЯ · АВТОСОХРАНЕНИЕ</small><h2>Редактор граней</h2><p>Загрузите изображения и измените формулировки. Всё сохранится на этом устройстве.</p></div><div class="grid" id="grid"></div><button class="save" onclick="editor(false)">Сохранить и перейти к кубу</button></div></div><div class="modal" id="modal" onclick="this.classList.remove('show')"><article id="detail" onclick="event.stopPropagation()"></article></div><script>
const defaults=[['Жилища народов','Рассмотри изображения и найди жилище русского народа.'],['Продолжи узор','Определи закономерность и продолжи орнамент.'],['Состав числа','Найди разные способы составить число семь.'],['Вопрос команде','Обсудите, что помогло выполнить задания вместе.']];let tasks;try{tasks=JSON.parse(localStorage.offlineMulticube)||defaults.map(x=>({title:x[0],text:x[1],image:''}))}catch(e){tasks=defaults.map(x=>({title:x[0],text:x[1],image:''}))}let turn=0,opened=false,drag=null;const cube=document.getElementById('cube');function save(){try{localStorage.offlineMulticube=JSON.stringify(tasks)}catch(e){}render()}function rotate(n){turn+=n;draw()}function draw(){cube.style.transform=`rotateX(60deg) rotateZ(${turn}deg)`;document.querySelectorAll('.card').forEach(x=>x.style.transform=`rotateZ(${-turn}deg)`)}function toggle(){opened=!opened;cube.classList.toggle('open',opened);openBtn.textContent=opened?'Закрыть куб':'Открыть мультикуб'}function render(){panels.innerHTML=tasks.map((t,i)=>`<button class="panel p${i}" onclick="showTask(${i})"><div class="card">${t.image?`<img src="${t.image}">`:`<strong style="font:38px Georgia">${i+1}</strong>`}<small>ЗАДАНИЕ ${i+1}</small><b>${esc(t.title)}</b></div></button>`).join('');grid.innerHTML=tasks.map((t,i)=>`<div class="item"><small>ГРАНЬ ${i+1}</small><label class="upload">${t.image?`<img src="${t.image}">`:'＋ Загрузить картинку'}<input type="file" accept="image/*" onchange="upload(${i},this.files[0])"></label><label>Название<input value="${esc(t.title)}" oninput="tasks[${i}].title=this.value;save()"></label><label>Текст задания<textarea oninput="tasks[${i}].text=this.value;save()">${esc(t.text)}</textarea></label></div>`).join('');draw()}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function editor(v){document.getElementById('editor').classList.toggle('show',v)}function upload(i,f){if(!f)return;let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tasks[i].image=c.toDataURL('image/jpeg',.8);save()};im.src=r.result};r.readAsDataURL(f)}function showTask(i){if(!opened)return;let t=tasks[i];detail.innerHTML=`<button class="close" onclick="modal.classList.remove('show')">×</button>${t.image?`<img src="${t.image}">`:''}<small>ЗАДАНИЕ ${i+1}</small><h2>${esc(t.title)}</h2><p>${esc(t.text)}</p>`;modal.classList.add('show')}scene.onpointerdown=e=>{scene.setPointerCapture(e.pointerId);drag=[e.clientX,turn]};scene.onpointermove=e=>{if(drag){turn=drag[1]+(e.clientX-drag[0])*.45;draw()}};scene.onpointerup=()=>drag=null;render();draw();
</script></body></html>
